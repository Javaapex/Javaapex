name: Sync Secrets To Personal Repos

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "local-1"]
  schedule:
    - cron: "*/2 * * * *"

permissions:
  contents: read

jobs:
  sync:
    environment: SYNC_PAT
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      INCLUDE_FORKS: "false"
      INCLUDE_ARCHIVED: "false"
      OVERWRITE_VARIABLES: "false"
      REPO_LIMIT: "1"
      CANDIDATE_REPO_LIMIT: "50"
    steps:
      - name: Validate controller secrets
        shell: bash
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          required=(
            SYNC_PAT
            SMTP_HOST
            SMTP_PORT
            SMTP_USER
            SMTP_PASSWORD
            TO_EMAIL
            FROM_EMAIL
            FOSSA_API_KEY
            SONAR_TOKEN
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required controller secret: $key"
              exit 1
            fi
          done

      - name: Install jq
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Sync missing secrets and variables
        shell: bash
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          FOSSA_COMMAND: ${{ vars.FOSSA_COMMAND }}
          PYSCODE_COMMAND: ${{ vars.PYSCODE_COMMAND }}
          SONAR_COMMAND: ${{ vars.SONAR_COMMAND }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          set -euo pipefail

          retry() {
            local attempts="$1"
            shift
            local n=1
            until "$@"; do
              if [[ $n -ge $attempts ]]; then
                return 1
              fi
              sleep $((2 * n))
              n=$((n + 1))
            done
          }

          gh auth status >/dev/null
          owner="$(retry 4 gh api user --jq .login)"
          echo "Sync owner: $owner"

          mapfile -t repos < <(
            retry 4 gh api "users/$owner/repos?per_page=100&type=owner" --paginate \
              --jq 'sort_by(.created_at) | reverse | .[].full_name' | head -n "${CANDIDATE_REPO_LIMIT:-50}"
          )
          if [[ ${#repos[@]} -eq 0 ]]; then
            echo "No repositories found for owner $owner"
            exit 0
          fi

          set_if_missing_secret() {
            local repo="$1"
            local key="$2"
            local value="$3"
            local existing
            existing="$(retry 4 gh secret list --repo "$repo" --json name --jq '.[].name' | tr '\n' ' ' || true)"
            if [[ " $existing " == *" $key "* ]]; then
              echo "[$repo] secret exists: $key"
              return 0
            fi
            if [[ -z "$value" ]]; then
              echo "[$repo] skip empty secret value: $key"
              return 0
            fi
            echo "$value" | retry 4 gh secret set "$key" --repo "$repo" --body -
            echo "[$repo] secret created: $key"
          }

          set_variable() {
            local repo="$1"
            local key="$2"
            local value="$3"
            if [[ -z "$value" ]]; then
              echo "[$repo] skip empty variable value: $key"
              return 0
            fi
            local existing
            existing="$(retry 4 gh variable list --repo "$repo" --json name --jq '.[].name' | tr '\n' ' ' || true)"
            if [[ " $existing " == *" $key "* ]]; then
              if [[ "$OVERWRITE_VARIABLES" == "true" ]]; then
                retry 4 gh variable set "$key" --repo "$repo" --body "$value"
                echo "[$repo] variable updated: $key"
              else
                echo "[$repo] variable exists: $key"
              fi
            else
              retry 4 gh variable set "$key" --repo "$repo" --body "$value"
              echo "[$repo] variable created: $key"
            fi
          }

          processed=0
          for repo in "${repos[@]}"; do
            if [[ "$processed" -ge "${REPO_LIMIT:-1}" ]]; then
              break
            fi
            if ! is_fork="$(retry 4 gh repo view "$repo" --json isFork --jq .isFork)"; then
              echo "Skipping $repo: failed to fetch fork status after retries"
              continue
            fi
            if ! is_archived="$(retry 4 gh repo view "$repo" --json isArchived --jq .isArchived)"; then
              echo "Skipping $repo: failed to fetch archive status after retries"
              continue
            fi
            if [[ "$INCLUDE_FORKS" != "true" && "$is_fork" == "true" ]]; then
              echo "Skipping fork: $repo"
              continue
            fi
            if [[ "$INCLUDE_ARCHIVED" != "true" && "$is_archived" == "true" ]]; then
              echo "Skipping archived: $repo"
              continue
            fi

            ready_val="$(retry 4 gh api "repos/$repo/actions/variables/SYNC_READY" --jq '.value' 2>/dev/null || true)"
            if [[ "$ready_val" == "true" ]]; then
              echo "Skipping already synced repo: $repo"
              continue
            fi

            echo "Processing: $repo"
            repo_key="$(echo "$repo" | tr '/.' '__' | tr -cd '[:alnum:]_-')"
            set_if_missing_secret "$repo" "SMTP_HOST" "$SMTP_HOST"
            set_if_missing_secret "$repo" "SMTP_PORT" "$SMTP_PORT"
            set_if_missing_secret "$repo" "SMTP_USER" "$SMTP_USER"
            set_if_missing_secret "$repo" "SMTP_PASSWORD" "$SMTP_PASSWORD"
            set_if_missing_secret "$repo" "TO_EMAIL" "$TO_EMAIL"
            set_if_missing_secret "$repo" "FROM_EMAIL" "$FROM_EMAIL"
            set_if_missing_secret "$repo" "FOSSA_API_KEY" "$FOSSA_API_KEY"
            set_if_missing_secret "$repo" "SONAR_TOKEN" "$SONAR_TOKEN"

            set_variable "$repo" "FOSSA_COMMAND" "$FOSSA_COMMAND"
            set_variable "$repo" "PYSCODE_COMMAND" "$PYSCODE_COMMAND"
            set_variable "$repo" "SONAR_COMMAND" "$SONAR_COMMAND"
            set_variable "$repo" "SONAR_HOST_URL" "$SONAR_HOST_URL"
            set_variable "$repo" "SONAR_ORGANIZATION" "$SONAR_ORGANIZATION"
            set_variable "$repo" "SONAR_PROJECT_KEY" "$repo_key"
            set_variable "$repo" "SYNC_READY" "true"
            processed=$((processed + 1))
          done

          echo "Sync complete."
